name: realclean

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realclean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libxml-xpath-perl wget

      # Tracked build products (e.g. js/, css/) may legitimately vanish, but
      # nothing untracked or ignored may remain after "make realclean".
      - name: Define leftover check
        run: |
          cat > "$RUNNER_TEMP/check-clean.sh" <<'EOF'
          #!/bin/sh
          leftover=$(git status --porcelain --ignored | grep -v '^ D ' || true)
          if [ -n "$leftover" ]; then
            echo "Leftover files after make realclean:" >&2
            echo "$leftover" >&2
            exit 1
          fi
          EOF
          chmod +x "$RUNNER_TEMP/check-clean.sh"

      - name: realclean on bare checkout
        run: |
          make realclean
          "$RUNNER_TEMP/check-clean.sh"

      - name: realclean on bare checkout is idempotent
        run: |
          before=$(git status --porcelain --ignored)
          make realclean
          test "$before" = "$(git status --porcelain --ignored)"
          "$RUNNER_TEMP/check-clean.sh"

      - name: Restore tracked files and run full build
        run: |
          git checkout -- .
          make build

      - name: realclean after full build
        run: |
          make realclean
          "$RUNNER_TEMP/check-clean.sh"

      - name: realclean after full build is idempotent
        run: |
          before=$(git status --porcelain --ignored)
          make realclean
          test "$before" = "$(git status --porcelain --ignored)"
          "$RUNNER_TEMP/check-clean.sh"
